# relay-checkin-plugin 配置文件
# 修改保存后大部分配置即时生效；schedule.cron 修改后需重启 Yunzai 才生效

# 定时签到
schedule:
  enable: true
  # cron 表达式（秒 分 时 日 月 周），默认每天 08:10
  cron: "0 10 8 * * *"
  # 触发后随机延迟 0~N 分钟再开始执行（避免整点并发特征），0 为不延迟
  jitterMinutes: 10
  # 相邻两个账号签到之间的随机间隔（秒），[最小, 最大]
  accountDelay: [5, 15]
  # 同时处理的用户数（单用户内部仍逐账号串行）；人多时调大，服务器弱则调小，上限 10
  concurrency: 3

# 定时签到结果推送
push:
  # group   = 将全部用户的签到结果推送到 data/push_groups.json 中的每个群（合并转发形式）
  #           群管理可在目标群发送 #中转开启群推送，将本群加入固定推送目标
  # private = 只私聊本人
  # off     = 不推送（仅记录日志）
  mode: group
  # 群合并转发时，每张图最多展示的用户数，超出自动分成多张图
  usersPerImage: 5

# 请求设置
request:
  # 单次请求超时（秒）
  timeout: 15
  # 网络错误重试次数
  # 仅 GET/HEAD 等只读请求会重试；签到 POST 固定只发送一次
  retry: 2
  userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

# 站点地址安全策略
security:
  # 默认只允许 HTTPS；确需使用 HTTP 站点时由机器人主人显式开启
  allowHttp: false
  # 默认禁止本机/内网/链路本地地址；确需访问私有站点时填写精确域名或 *.example.com
  allowedPrivateHosts: []

# 浏览器方案（AnyRouter 过阿里云 WAF、Turnstile/POW 站点自动降级签到）
browser:
  enable: true
  # 浏览器程序路径；留空时自动选择版本最高的系统 Chrome/Edge，找不到才使用 Puppeteer 自带 Chromium
  # snap 版 Chromium（含 Ubuntu 转发脚本 /usr/bin/chromium-browser）会被跳过：它被 AppArmor
  # 关在 $HOME/snap 内，读写不了本插件的浏览器档案目录，只会报 SingletonLock: Permission denied
  # Turnstile 要求浏览器保持较新，旧版 TRSS-Yunzai 建议显式填写最新版 Chrome 路径
  # Linux: /usr/bin/google-chrome    Windows: C:\Program Files\Google\Chrome\Application\chrome.exe
  executablePath: ""
  # 等待 WAF 放行的最长时间（秒）；anyrouter 的阿里云 WAF 较慢，不够时可加大
  wafTimeoutSec: 60
  # 关闭可见接管后，Turnstile 无头尝试的最长时间（秒），范围 5~120
  turnstileTimeoutSec: 30
  # 是否在机器人运行设备上直接打开可见浏览器处理 Turnstile
  # 可见窗口使用独立持久档案，断开调试连接后由系统真实指针自动勾选复选框
  # Windows 和有桌面的机器直接用本机指针，无桌面 Linux 会自动拉起 Xvfb + xdotool；关闭后才使用无头模式
  # 无桌面 Linux 必须先装好 xdotool（apt install xdotool）：虚拟屏里的窗口没人看得见，
  # 缺了它谁也勾选不了，此时插件会直接跳过验证并提示安装，而不是白等一个超时
  turnstileInteractive: true
  # 等待可见浏览器完成 Turnstile 的最长时间（秒），范围 30~600
  turnstileInteractiveTimeoutSec: 120
  # NewAPI POW-Shield 计算并提交签到的最长时间（秒），范围 15~300
  powTimeoutSec: 120
  # 浏览器空闲多久后自动关闭（秒）
  idleCloseSec: 300
  # 全局同时打开的浏览器页面上限（每页约数十 MB 内存），超出的任务排队；上限 10
  maxConcurrentPages: 2
  # 排队等待浏览器空闲的最长时间（秒），超时该账号本次判定失败；范围 30~600
  # 手动指令的整体超时会自动覆盖排队和当前验证模式，无需另行配置
  slotWaitSec: 120

# 只发 #中转添加 地址 发起绑定后的私聊补发流程
bind:
  # 等待私聊补发凭据的超时时间（秒）
  timeoutSec: 300
  # 群内绑定提示/回执消息自动撤回秒数，防多人使用刷屏；0 = 不撤回
  # 绑定出结果（成功/失败/超时）时提示消息会立即撤回，此处是未出结果时的兜底时间
  # 注意：QQ 只允许撤回 2 分钟内自己发的消息，最大 120
  groupRecallSec: 60

# 代理设置（anyrouter.top 等站点国内网络无法直连时配置）
proxy:
  # 代理地址，支持 http 代理（如 Clash: http://127.0.0.1:7890），可带账密 http://user:pass@host:port
  # 留空 = 不使用代理；无头和可见浏览器方案同样走此代理
  url: ""
  # 需要走代理的站点域名关键字（按包含匹配）；留空数组 = 配置了代理后全部站点走代理
  hosts:
    - anyrouter
    - agentrouter
  # 无头浏览器是否也显式走上面的代理地址。
  # 若代理软件开启了 TUN / 系统代理（如 Clash Verge 的 TUN 模式），
  # 浏览器再显式指定代理可能形成环路导致页面永远打不开——这种情况请设为 false，
  # 让浏览器直连、由系统层透明转发（API 请求仍走上面的代理）
  useForBrowser: true

# 群聊中使用 #中转添加 后，尝试撤回用户消息（令牌敏感），需机器人有管理员权限
recallAdd: true
